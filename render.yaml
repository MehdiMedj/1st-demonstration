# Render Blueprint — one-click deploy of the whole FleetOS stack.
# In the Render dashboard: New + → Blueprint → point at this repo/branch.
# Provisions: managed PostgreSQL (PostGIS enabled by the migration), managed
# Redis, the FastAPI backend, and the Next.js frontend.
#
# Free plans are used so it deploys with no cost; bump `plan:` for production.

databases:
  - name: fleetos-db
    plan: free
    postgresMajorVersion: "16"
    # PostGIS + pgcrypto are enabled by the app's Alembic migration on boot.

services:
  # ─── Redis (telemetry pub/sub) ───
  # If your account exposes this as "Key Value", change type to `keyvalue`.
  - type: redis
    name: fleetos-redis
    plan: free
    ipAllowList: [] # internal-only (reachable from other Render services)

  # ─── Backend API (FastAPI) ───
  - type: web
    name: fleetos-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Run migrations, then serve on Render's injected $PORT.
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fleetos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fleetos-redis
          property: connectionString
      # Allow the frontend origin through CORS (host normalised to https://host).
      - key: FRONTEND_URL
        fromService:
          type: web
          name: fleetos-frontend
          property: host

  # ─── Frontend (Next.js) ───
  - type: web
    name: fleetos-frontend
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    envVars:
      # Backend host; app/layout.tsx builds https://<host> and wss://<host>/…
      - key: API_HOST
        fromService:
          type: web
          name: fleetos-backend
          property: host
